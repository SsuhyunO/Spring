<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>user4::수정</title>
	</head>
	<body>
		<h4>User4 수정</h4>
		<a th:href="@{/}">메인</a>
		<a th:href="@{/user4/list}">목록</a>
		<a th:href="@{/user4/register}">등록</a>

		<form th:action="@{/user4/modify}" method="post">
			<table border="1">
				<tr>
					<td>아이디</td>
					<td><input type="text" name="userid" th:value="${user4DTO.userid}" readonly="readonly"></td>
				</tr>
				<tr>
					<td>이름</td>
					<td><input type="text" name="name" th:value="${user4DTO.name}"></td>
				</tr>
				<tr>
					<td>성별</td>
					<td>
						<label>
							<input type="radio" th:field="*{user4DTO.gender}" value="M">남
						</label>
						<label>
							<input type="radio" th:field="*{user4DTO.gender}" value="F">여
						</label>
					</td>
				</tr>
				<tr>
					<td>나이</td>
					<td><input type="number" name="age" th:value="${user4DTO.age}"></td>
				</tr>
				<tr>
					<td>휴대폰</td>
					<td><input type="text" name="hp" th:value="${user4DTO.hp}"></td>
				</tr>
				<tr>
					<td>주소</td>
					<td><input type="text" name="addr" th:value="${user4DTO.addr}"></td>
				</tr>
				<tr>
					<td colspan="4" align="right">
						<input type="submit" value="등록하기">
					</td>
				</tr>
			</table>
		</form>
		
		
	</body>
</html>
